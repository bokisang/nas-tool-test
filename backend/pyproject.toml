[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ainas-search"
version = "0.1.0"
description = "Local-first AI NAS search backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ainas"]
artifacts = ["src/ainas/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
